<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="../">
<style>
  body { margin: 0; background: #f5f5f2; font: 12px Geist, system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-bottom: 1px solid #ddd; }
  .row b { width: 150px; flex: none; }
  .cell { display: grid; justify-items: center; color: #777; }
  canvas { width: 120px; height: 120px; background: #fff; }
</style>
</head>
<body>
<div id="sheet"></div>
<script src="vendor/rive.js"></script>
<script type="module">
// Contact sheet: each requested timeline sampled at N evenly spaced times.
//   tools/rive-sheet.html?anims=a,b,c&n=12
import { RiveSeek } from './lib/rive-seek.js'
try {
  const q = new URLSearchParams(location.search)
  const n = Number(q.get('n') ?? 12)
  const scratch = document.createElement('canvas')
  scratch.width = scratch.height = 240
  const devy = await RiveSeek.load('assets/devy/all_devy.riv', scratch)
  // anims=a,b~c,d@1-3 : "~" stacks layers (first is the base), "@from-to" picks a range.
  const specs = q.get('anims') ? q.get('anims').split(',') : Object.keys(devy.timelines)
  for (const spec of specs) {
    const [stack, range] = spec.split('@')
    const layers = stack.split("~")
    const name = stack
    const full = Math.max(...layers.map((l) => devy.timelines[l].duration))
    const [from, to] = range ? range.split('-').map(Number) : [0, full]
    const duration = to - from
    const row = document.createElement('div')
    row.className = 'row'
    row.innerHTML = `<b>${name}<br><span style="font-weight:400">${from.toFixed(2)}–${to.toFixed(2)}s</span></b>`
    for (let i = 0; i < n; i++) {
      const t = from + (n === 1 ? 0 : (duration * i) / (n - 1))
      devy.draw(layers.map((l) => ({ name: l, time: t })))
      const c = document.createElement('canvas')
      c.width = c.height = 240
      c.getContext('2d').drawImage(scratch, 0, 0)
      const cell = document.createElement('div')
      cell.className = 'cell'
      cell.append(c, Object.assign(document.createElement('span'), { textContent: `${t.toFixed(2)}s` }))
      row.append(cell)
    }
    document.getElementById('sheet').append(row)
  }
  window.result = 'ok'
} catch (e) {
  window.result = { error: String(e?.stack ?? e) }
}
</script>
</body>
</html>
